<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151b">
<meta name="description" content="2026학년도 GSHS 스포츠한마당 교직원 안내">
<title>GSHS SPORTS DAY 2026</title>
<style>
:root {
  --bg: #f6f8fc;
  --surface: #ffffff;
  --text: #182338;
  --muted: #65728a;
  --primary: #2458e6;
  --primary-dark: #173db0;
  --accent: #ffb020;
  --border: #e4e9f2;
  --shadow: 0 12px 36px rgba(25, 45, 90, 0.10);
  --radius: 20px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 86px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    "Pretendard",
    "Noto Sans KR",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

section {
  scroll-margin-top: 86px;
}

.container {
  width: min(1120px, calc(100% - 40px));
  margin-inline: auto;
}

/* 공통 제목 */
.section-title {
  margin: 0 0 14px;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.25;
  letter-spacing: -0.04em;
}

.section-description {
  margin: 0 0 32px;
  color: var(--muted);
  font-size: 16px;
}

/* 상단 진행 표시줄 */
#progress {
  position: fixed;
  z-index: 1001;
  top: 0;
  left: 0;
  width: 0;
  height: 4px;
  background: linear-gradient(
    90deg,
    var(--primary),
    #8b5cf6,
    var(--accent)
  );
}

/* 상단 내비게이션 */
#nav {
  position: fixed;
  z-index: 1000;
  top: 0;
  right: 0;
  left: 0;
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px max(20px, calc((100vw - 1120px) / 2));
  background: rgba(255, 255, 255, 0.82);
  border-bottom: 1px solid transparent;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition:
    background 0.3s ease,
    box-shadow 0.3s ease,
    border-color 0.3s ease;
}

#nav.scrolled {
  background: rgba(255, 255, 255, 0.96);
  border-color: var(--border);
  box-shadow: 0 5px 24px rgba(25, 45, 90, 0.08);
}

.logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.04em;
}

#navLinks {
  display: flex;
  align-items: center;
  gap: 24px;
}

#navLinks a {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  transition: color 0.2s ease;
}

#navLinks a:hover,
#navLinks a:focus-visible {
  color: var(--primary);
}

#menuBtn {
  display: none;
  border: 0;
  border-radius: 10px;
  padding: 8px 12px;
  background: var(--surface);
  color: var(--text);
}

/* 첫 화면 */
.hero {
  position: relative;
  min-height: 90vh;
  min-height: 90svh;
  display: grid;
  align-items: center;
  overflow: hidden;
  padding: 120px 0 80px;
  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(255, 176, 32, 0.22),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 75%,
      rgba(36, 88, 230, 0.15),
      transparent 32%
    ),
    linear-gradient(135deg, #f8faff, #edf2ff);
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 850px;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  padding: 7px 14px;
  border: 1px solid rgba(36, 88, 230, 0.18);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--primary);
  font-size: 13px;
  font-weight: 800;
}

.hero h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 88px);
  line-height: 1.12;
  letter-spacing: -0.065em;
}

.hero h1 span {
  color: var(--primary);
}

.hero p {
  max-width: 650px;
  margin: 24px 0 30px;
  color: var(--muted);
  font-size: clamp(16px, 2vw, 20px);
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

/* 버튼 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 12px 22px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-weight: 800;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(25, 45, 90, 0.15);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.btn-secondary {
  border-color: var(--border);
  background: #fff;
  color: var(--text);
}

/* 일반 섹션 */
.section {
  padding: 100px 0;
}

.section:nth-of-type(even) {
  background: var(--surface);
}

/* 카드 레이아웃 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.card {
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 45px rgba(25, 45, 90, 0.14);
}

.card h3 {
  margin: 0 0 10px;
  font-size: 21px;
}

.card p {
  margin: 0;
  color: var(--muted);
}

/* 일정·안내 목록 */
.info-list {
  display: grid;
  gap: 14px;
}

.info-item {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 20px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}

.info-label {
  color: var(--primary);
  font-weight: 900;
}

.info-content {
  min-width: 0;
}

/* 스크롤 진입 및 퇴장 애니메이션
   .reveal 관련 규칙은 이 부분에 한 번만 작성합니다. */
.reveal {
  opacity: 0;
  transform: translateY(34px) scale(0.985);
  filter: blur(5px);
  transition:
    opacity 0.85s ease,
    transform 0.85s cubic-bezier(0.2, 0.7, 0.2, 1),
    filter 0.85s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  filter: blur(0);
}

.reveal.fade-away {
  opacity: 0;
  transform: translateY(-22px) scale(0.985);
  filter: blur(5px);
}

.delay1 {
  transition-delay: 0.1s;
}

.delay2 {
  transition-delay: 0.2s;
}

.delay3 {
  transition-delay: 0.3s;
}

/* 맨 위로 이동 버튼 */
#topBtn {
  position: fixed;
  z-index: 999;
  right: 22px;
  bottom: 22px;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 22px;
  box-shadow: 0 8px 24px rgba(25, 45, 90, 0.22);
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition:
    opacity 0.25s ease,
    visibility 0.25s ease,
    transform 0.25s ease;
}

#topBtn.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

#topBtn:hover {
  background: var(--primary-dark);
}

/* 하단 */
footer {
  padding: 40px 20px;
  background: #17233c;
  color: rgba(255, 255, 255, 0.78);
  text-align: center;
}

footer p {
  margin: 0;
}

/* 키보드 접근성 */
a:focus-visible,
button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}

/* 태블릿 및 작은 화면 */
@media (max-width: 850px) {
  #nav {
    min-height: 64px;
  }

  #menuBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #navLinks {
    position: absolute;
    top: calc(100% + 1px);
    right: 0;
    left: 0;
    display: none;
    align-items: stretch;
    gap: 0;
    padding: 10px 20px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 12px 20px rgba(25, 45, 90, 0.08);
  }

  #navLinks.open {
    display: flex;
    flex-direction: column;
  }

  #navLinks a {
    padding: 12px 0;
  }

  .card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .section {
    padding: 76px 0;
  }
}

/* 스마트폰 */
@media (max-width: 540px) {
  .container {
    width: min(100% - 28px, 1120px);
  }

  .hero {
    min-height: 82svh;
    padding: 105px 0 64px;
  }

  .hero h1 {
    font-size: clamp(38px, 11vw, 58px);
  }

  .hero-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .hero-actions .btn {
    width: 100%;
  }

  .card-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 22px;
  }

  .info-item {
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 18px;
  }

  .section {
    padding: 60px 0;
  }

  #topBtn {
    right: 14px;
    bottom: 14px;
    width: 44px;
    height: 44px;
  }
}

/* 사용자가 운영체제에서 애니메이션 감소를 선택한 경우 */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .reveal,
  .reveal.visible,
  .reveal.fade-away {
    opacity: 1;
    transform: none;
    filter: none;
  }
}
</head>
<body>
<div class="progress" id="progress"></div>
<header class="nav" id="nav"><div class="nav-inner">
<a class="brand" href="#home">GSHS <span>●</span> SPORTS DAY</a>
<button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">MENU ☰</button>
<nav class="nav-links" id="navLinks"><a href="#overview">대회 개요</a><a href="#teams">팀 소개</a><a href="#schedule">일정</a><a href="#games">경기·점수</a><a href="#teachers">교직원 안내</a><a href="#safety">안전 안내</a></nav>
</div></header>
<main>
<section class="hero" id="home"><div class="wrap hero-grid">
<div class="hero-copy">
<div class="eyebrow reveal">Gyeonggi Science High School · 2026</div>
<h1 class="reveal delay1">SPORTS<br><em>DAY.</em></h1>
<p class="hero-sub reveal delay2">서로를 응원하고, 함께 뛰고, 하나가 되는 하루.<br>2026학년도 GSHS 스포츠한마당 교직원 안내</p>
<div class="hero-date reveal delay3"><span class="date-mark">10.30 FRI</span><span>2026년 10월 30일(금)<br>본교 운동장 및 창조관</span></div>
</div>
<div class="hero-art" aria-hidden="true"><div class="orb"></div><div class="orbit-label">ONE TEAM, ONE DAY</div></div>
</div><a class="scroll-hint" href="#overview">SCROLL TO EXPLORE</a></section>
<section id="overview"><div class="wrap">
<div class="section-head reveal"><div><div class="eyebrow">01 / Overview</div><h2>대회 한눈에 보기</h2></div><p>경쟁보다 협동, 승리보다 스포츠맨십. 모든 학생이 안전하고 즐겁게 참여할 수 있도록 함께 준비합니다.</p></div>
<div class="stats">
<div class="stat reveal"><strong data-count="372">372</strong><span>전교생 · 명</span></div><div class="stat reveal delay1"><strong data-count="4">4</strong><span>참가 팀</span></div><div class="stat reveal delay2"><strong data-count="9">9</strong><span>경기 종목</span></div><div class="stat reveal delay3"><strong data-count="6">6</strong><span>스포츠 부스</span></div>
</div>
<div style="margin-top:20px" class="reveal"><p style="color:var(--muted);font-size:.9rem">대상: 경기과학고등학교 교육공동체 · 팀 편성: 학년별 2개 학급씩 연합, 추첨으로 4개 팀 구성</p><p style="color:var(--lime);font-weight:800">원칙: 환자를 제외한 모든 학생은 최소 3개 종목 이상 선수로 참가합니다.</p></div>
</div></section>
<section id="teams" style="background:#0c1116"><div class="wrap">
<div class="section-head reveal"><div><div class="eyebrow">02 / Team Up</div><h2>우리 팀을 확인하세요</h2></div><p>캐치프레이즈는 「합」. 서로 다른 색깔의 네 팀이 함께 만드는 스포츠한마당입니다.</p></div>
<div class="teams">
<article class="team a reveal"><div class="team-top"><span>TEAM A</span><span>01 / 04</span></div><div><div class="team-letter">A.</div><h3>희로A락</h3><p>1학년 1-3 / 1-4<br>2학년 2-3 / 2-4<br>3학년 3-4 / 3-6</p></div></article>
<article class="team b reveal delay1"><div class="team-top"><span>TEAM B</span><span>02 / 04</span></div><div><div class="team-letter">B.</div><h3>B교불가</h3><p>1학년 1-5 / 1-7<br>2학년 2-1 / 2-8<br>3학년 3-3 / 3-5</p></div></article>
<article class="team c reveal delay2"><div class="team-top"><span>TEAM C</span><span>03 / 04</span></div><div><div class="team-letter">C.</div><h3>오이C</h3><p>1학년 1-1 / 1-6<br>2학년 2-2 / 2-7<br>3학년 3-1 / 3-7</p></div></article>
<article class="team d reveal delay3"><div class="team-top"><span>TEAM D</span><span>04 / 04</span></div><div><div class="team-letter">D.</div><h3>하D캐리</h3><p>1학년 1-2 / 1-8<br>2학년 2-5 / 2-6<br>3학년 3-2 / 3-8</p></div></article>
</div>
</div></section>
<section id="day"><div class="wrap">
<div class="section-head reveal"><div><div class="eyebrow">03 / The Day</div><h2>하루의 흐름</h2></div><p>08:40 팀별 자리 착석부터 경기와 공연, 폐회식까지. 세부 일정은 운영팀 협의에 따라 일부 변경될 수 있습니다.</p></div>
<div class="timeline">
<div class="time-item reveal"><time>08:40</time><h3>팀별 착석</h3><p>출석·환자 확인</p></div><div class="time-item reveal delay1"><time>08:50</time><h3>개회식</h3><p>준비운동</p></div><div class="time-item reveal delay2"><time>09:10</time><h3>오전 경기</h3><p>6개 종목</p></div><div class="time-item reveal delay3"><time>12:20</time><h3>점심시간</h3><p>급식실 질서</p></div><div class="time-item reveal"><time>13:10</time><h3>부스·공연</h3><p>협동 퍼포먼스</p></div><div class="time-item reveal delay1"><time>13:50</time><h3>오후 경기</h3><p>4개 종목</p></div><div class="time-item reveal delay2"><time>15:40</time><h3>폐회식</h3><p>성적 발표·시상</p></div>
</div></div></section>
<section id="schedule" style="background:#0c1116"><div class="wrap">
<div class="section-head reveal"><div><div class="eyebrow">04 / Schedule</div><h2>세부 시간표</h2></div><p>경기 진행과 학생 이동 안내 시 참고해 주세요.</p></div>
<div class="schedule">
<div class="schedule-card reveal"><h3>☀️ 오전 프로그램 <span class="pill">AM</span></h3>
<div class="event"><time>08:50–09:10</time><div><strong>개회식 및 준비운동</strong></div></div>
<div class="event"><time>09:10–09:40</time><div><strong>청·홍 양면 뒤집기</strong><small>예선 / 결승</small></div></div>
<div class="event"><time>09:40–10:20</time><div><strong>8자 줄넘기</strong></div></div>
<div class="event"><time>10:20–10:50</time><div><strong>3인 4각 이어달리기</strong></div></div>
<div class="event"><time>10:50–11:20</time><div><strong>전략 줄다리기</strong><small>예선 / 결승</small></div></div>
<div class="event"><time>11:20–11:50</time><div><strong>태풍의 눈</strong></div></div>
<div class="event"><time>11:50–12:20</time><div><strong>농구</strong><small>결승 · 창조관 2층</small></div></div>

</div>

<div class="event"><time>13:30–13:45</time><div><strong>문화 공연</strong><small>딜레마 & 플로렌스</small></div></div>
<div class="event"><time>13:45–13:50</time><div><strong>단체 협동 퍼포먼스</strong><small>「붉은 노을」 댄스 챌린지</small></div></div>

<div class="event"><time>14:10–14:50</time><div><strong>축구</strong><small>결승</small></div></div>
<div class="event"><time>14:50–15:10</time><div><strong>러닝 줄다리기</strong><small>결승</small></div></div>
<div class="event"><time>15:10–15:30</time><div><strong>이어달리기</strong></div></div>
<div class="event"><time>15:40–16:00</time><div><strong>폐회식</strong><small>16:00 이후 뒷정리 및 환경정화</small></div></div>
</div></div>
</div></section>
<section id="games"><div class="wrap">
<div class="section-head reveal"><div><div class="eyebrow">05 / Game Guide</div><h2>경기와 점수</h2></div><p>종목별 참가 인원과 여학생 최소 참가 인원을 확인해 주세요. 경기 방법은 일부 변경될 수 있습니다.</p></div>
<div class="sports-grid">
<div class="sport reveal"><span class="num">01 / FIELD</span><h3>청·홍 양면 뒤집기</h3><p>운동장 · 학년별 28명(4개 조)<br>여학생: 4개 조 8명 이상</p></div>
<div class="sport reveal delay1"><span class="num">02 / TEAM</span><h3>8자 줄넘기</h3><p>운동장 · 환자 제외 전원(3개 조)</p></div>
